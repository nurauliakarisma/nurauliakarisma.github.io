<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
    <defs>
        <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
            <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#FACC15" stop-opacity="0.25"/>
        </linearGradient>

        <linearGradient id="bgGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FACC15" stop-opacity="0.3"/>
            <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#0E7490" stop-opacity="0.1"/>
        </linearGradient>

        <linearGradient id="bgGrad3" x1="50%" y1="100%" x2="50%" y2="0%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.15"/>
        </linearGradient>

        <radialGradient id="cornerGlow1" cx="85%" cy="15%" r="45%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
            <stop offset="60%" stop-color="#FACC15" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="cornerGlow2" cx="15%" cy="85%" r="50%">
            <stop offset="0%" stop-color="#FACC15" stop-opacity="0.08"/>
            <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <filter id="bgGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Ambient Gradients -->
    <rect width="1440" height="900" fill="url(#cornerGlow1)"/>
    <rect width="1440" height="900" fill="url(#cornerGlow2)"/>

    <!-- Large Topographic Curves: Top-Right Group -->
    <path d="M1500,50 C1350,80 1200,30 1100,120 C1000,210 1150,320 1080,420 C1010,520 850,560 780,680 C710,800 800,920 750,1000" 
          stroke="url(#bgGrad1)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.45"/>

    <path d="M1520,90 C1370,120 1220,70 1120,160 C1020,250 1170,360 1100,460 C1030,560 870,600 800,720 C730,840 820,960 770,1040" 
          stroke="url(#bgGrad1)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>

    <path d="M1540,130 C1390,160 1240,110 1140,200 C1040,290 1190,400 1120,500 C1050,600 890,640 820,760 C750,880 840,1000 790,1080" 
          stroke="url(#bgGrad2)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.3"/>

    <path d="M1560,170 C1410,200 1260,150 1160,240 C1060,330 1210,440 1140,540 C1070,640 910,680 840,800 C770,920 860,1040 810,1120" 
          stroke="url(#bgGrad2)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.2"/>

    <!-- Bottom-Left / Center Group -->
    <path d="M-100,650 C120,580 280,720 450,640 C620,560 700,750 900,680 C1100,610 1250,780 1500,720" 
          stroke="url(#bgGrad1)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.35"/>

    <path d="M-80,690 C140,620 300,760 470,680 C640,600 720,790 920,720 C1120,650 1270,820 1520,760" 
          stroke="url(#bgGrad2)" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.25"/>

    <path d="M-60,730 C160,660 320,800 490,720 C660,640 740,830 940,760 C1140,690 1290,860 1540,800" 
          stroke="url(#bgGrad3)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.2"/>

    <!-- Top-Left Flow -->
    <path d="M-50,80 C150,140 250,-20 420,60 C590,140 720,40 880,120" 
          stroke="url(#bgGrad1)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.3"/>

    <path d="M-30,120 C170,180 270,20 440,100 C610,180 740,80 900,160" 
          stroke="url(#bgGrad2)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.2"/>

    <!-- Floating Glowing Nodes & Crosshairs -->
    <circle cx="1100" cy="120" r="3.5" fill="#06B6D4" filter="url(#bgGlow)"/>
    <circle cx="1100" cy="120" r="1.5" fill="#FFFFFF"/>

    <circle cx="1080" cy="420" r="4" stroke="#FACC15" stroke-width="1" fill="none" opacity="0.6"/>
    <circle cx="1080" cy="420" r="1.5" fill="#FACC15"/>

    <circle cx="780" cy="680" r="3" fill="#22D3EE" opacity="0.8"/>

    <circle cx="450" cy="640" r="4" stroke="#06B6D4" stroke-width="1" fill="none" opacity="0.6"/>
    <circle cx="450" cy="640" r="1.5" fill="#06B6D4"/>

    <circle cx="900" cy="680" r="3" fill="#FACC15" filter="url(#bgGlow)"/>
    <circle cx="900" cy="680" r="1.2" fill="#FFFFFF"/>

    <!-- Plus Markers -->
    <path d="M980,240 L980,248 M976,244 L984,244" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <path d="M600,480 L600,488 M596,484 L604,484" stroke="#FACC15" stroke-width="1" opacity="0.35"/>
    <path d="M300,320 L300,328 M296,324 L304,324" stroke="#22D3EE" stroke-width="1" opacity="0.3"/>
    <path d="M1280,580 L1280,588 M1276,584 L1284,584" stroke="#FACC15" stroke-width="1" opacity="0.4"/>
</svg>
