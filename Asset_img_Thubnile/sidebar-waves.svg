<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" fill="none">
    <defs>
        <!-- Gradients -->
        <linearGradient id="cyanYellow1" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
            <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#FACC15" stop-opacity="0.7"/>
        </linearGradient>

        <linearGradient id="cyanYellow2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FACC15" stop-opacity="0.6"/>
            <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
        </linearGradient>

        <linearGradient id="cyanYellow3" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#0891B2" stop-opacity="0.4"/>
            <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.3"/>
        </linearGradient>

        <radialGradient id="ambientGlow" cx="40%" cy="70%" r="60%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
            <stop offset="50%" stop-color="#FACC15" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#0B0914" stop-opacity="0"/>
        </radialGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Ambient background glow -->
    <rect width="320" height="480" fill="url(#ambientGlow)"/>

    <!-- Contour Waves -->
    <path d="M-40,460 C30,420 60,340 30,280 C0,220 80,180 140,190 C200,200 240,280 210,360 C180,440 260,470 340,440" 
          stroke="url(#cyanYellow1)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6"/>

    <path d="M-20,440 C50,400 80,320 50,260 C20,200 100,160 160,170 C220,180 260,260 230,340 C200,420 280,450 350,420" 
          stroke="url(#cyanYellow1)" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.45"/>

    <path d="M0,420 C70,380 100,300 70,240 C40,180 120,140 180,150 C240,160 280,240 250,320 C220,400 300,430 360,400" 
          stroke="url(#cyanYellow2)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>

    <path d="M20,400 C90,360 120,280 90,220 C60,160 140,120 200,130 C260,140 300,220 270,300 C240,380 320,410 370,380" 
          stroke="url(#cyanYellow2)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>

    <path d="M-50,380 C20,330 50,250 20,190 C-10,130 70,90 130,100 C190,110 230,190 200,270 C170,350 250,380 330,350" 
          stroke="url(#cyanYellow3)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.3"/>

    <path d="M-30,480 C40,450 110,390 90,310 C70,230 160,170 230,210 C300,250 280,370 350,420" 
          stroke="url(#cyanYellow1)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.55"/>

    <path d="M-60,320 C10,270 90,210 60,140 C30,70 140,40 210,80 C280,120 250,220 330,280" 
          stroke="url(#cyanYellow2)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.25"/>

    <path d="M40,470 C110,430 150,350 120,290 C90,230 170,190 230,200 C290,210 320,310 300,390" 
          stroke="url(#cyanYellow3)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- Glowing Nodes & Circles -->
    <circle cx="30" cy="280" r="3.5" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="30" cy="280" r="1.5" fill="#FFFFFF"/>
    
    <circle cx="210" cy="360" r="3" fill="#FACC15" filter="url(#glow)"/>
    <circle cx="210" cy="360" r="1.2" fill="#FFFFFF"/>

    <circle cx="140" cy="190" r="2.5" fill="#22D3EE" opacity="0.8"/>
    <circle cx="180" cy="150" r="2" fill="#FACC15" opacity="0.7"/>

    <circle cx="70" cy="240" r="4" stroke="#06B6D4" stroke-width="1" fill="none" opacity="0.6"/>
    <circle cx="70" cy="240" r="1.5" fill="#06B6D4"/>

    <circle cx="270" cy="300" r="5" stroke="#FACC15" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="270" cy="300" r="1.5" fill="#FACC15"/>

    <!-- Subtle Plus Accents -->
    <path d="M260,180 L260,186 M257,183 L263,183" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <path d="M100,350 L100,356 M97,353 L103,353" stroke="#FACC15" stroke-width="1" opacity="0.4"/>
    <path d="M40,130 L40,136 M37,133 L43,133" stroke="#22D3EE" stroke-width="0.8" opacity="0.3"/>
</svg>
